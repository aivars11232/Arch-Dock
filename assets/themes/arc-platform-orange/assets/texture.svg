<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Arc Platform Orange's 3D platform seen from above, in the colours of its
       own 2D artwork: a dark brown slab between copper rim strokes. The mesh
       maps x, y in [-1, 1] onto this square, so radius r lands at 128 * r. -->
  <defs>
    <radialGradient id="slab" cx="128" cy="128" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0.76" stop-color="#4d2110"/>
      <stop offset="1" stop-color="#251006"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="#b8521f"/>
  <circle cx="128" cy="128" r="120.3" fill="url(#slab)"/>
  <circle cx="128" cy="128" r="92.2" fill="#b8521f"/>
  <circle cx="128" cy="128" r="118.6" fill="none" stroke="#e0672a" stroke-width="3.4"/>
  <circle cx="128" cy="128" r="93.9" fill="none" stroke="#e0672a" stroke-width="3"/>
</svg>
